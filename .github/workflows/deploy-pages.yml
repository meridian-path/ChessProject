name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push cancels an in-flight deploy rather
# than queueing behind it, since only the latest commit's build should ever
# ship. That "pages" group must stay scoped to non-PR events only (push /
# workflow_dispatch) -- pull_request runs get their own per-PR group below
# so that two unrelated PRs' builds never cancel each other just because
# they happen to overlap in time (this repo often has multiple PRs open at
# once). A new push to the SAME PR still correctly cancels that PR's own
# stale run, since the group is keyed on the PR number, not the commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

# build -> quality -> deploy, so a failing quality gate blocks the deploy.
# build and quality also run on pull requests (as PR status checks), but
# deploy is gated to push events only -- see the deploy job's `if:` below.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test/drillHubClient.test.js requires('playwright') directly (a real
      # browser-driven spoiler-regression test, not a stub) and `npm test`
      # picks up every test/*.test.js file, so this job needs a real
      # Chromium install too -- not just the quality job below. Without
      # this, that test hangs indefinitely trying to launch a browser that
      # was never installed (confirmed: run 31913876615, cancelled after
      # 56+ minutes stuck on this exact step). Same cache-then-install
      # pattern as the quality job's "Resolve installed Playwright version"
      # / "Cache Playwright browsers" / "Install Playwright Chromium" steps
      # below -- kept identical rather than reinvented so the two jobs
      # share the same cache key shape.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Dozens of test files already existed but `npm test` was never wired
      # into CI -- the highest-value single line in this file.
      - name: Run test suite
        run: npm test

      # Aggregate data (data/aggregates/manifest.json + root.json + f/*.json)
      # published by ingest-dump.yml as a GitHub Release asset -- deliberately
      # not git-tracked past manifest.json itself (~30MB of shards; see
      # .gitignore and scripts/verifyAggregates.js's header comment), so an
      # ordinary checkout has the manifest but not the shards it lists.
      # src/explorerSource.js's isAggregatesAvailable() requires BOTH
      # manifest.json AND root.json on disk before it will read cached data
      # at all -- without this step, that check always failed here and every
      # builder (buildRepertoire.js, buildContent.js, buildDrill.js,
      # buildEcoPages.js) fell back to live Opening Explorer calls for the
      # WHOLE site, which is what was actually causing the recurring
      # "Lichess Opening Explorer rate limit hit" build failures (this
      # workflow's own history, and run 31906005148). Extracting the
      # published shards here is the fix: with them on disk, only two kinds
      # of live call remain --
      #   1. the masters-database lookup (one narrow, named exception:
      #      real grandmaster games, no equivalent in the
      #      dump pipeline) -- one call per opening page, unchanged by this
      #      step, still needs LICHESS_API_TOKEN;
      #   2. a same-position retry for the disclosed, currently-permanent
      #      ingest-sampling "known gap" (a position several openings share,
      #      e.g. the Italian/Ruy Lopez/Scotch common start, that landed in
      #      one family's shard and not a sibling's -- see
      #      src/buildContent.js's fetchLineWithValidation) -- rare, and only
      #      as a last resort after the aggregate lookup comes up empty.
      # So LICHESS_API_TOKEN stays required for now, but is no longer on the
      # hot path for the bulk of the site's content.
      #
      # AGGREGATE_DATA_TAG is a specific, hand-pinned Release tag, not
      # "latest" -- ingest-dump.yml also publishes smoke-test releases
      # (tag suffix "-smoke") from the same repo, and GitHub's "latest"
      # release designation would silently pick up a smoke-test release if
      # one is ever published after the real one. Bump this by hand to the
      # newest verified data-<month> (non-smoke) tag after each full ingest
      # run -- automating that discovery is future work, not in this change.
      #
      # RESILIENCE: if the tagged release doesn't exist (a future month
      # whose ingest hasn't run yet, or a stale/unbumped tag), this step
      # must not fail the job -- it falls back to the pre-existing safe
      # behavior instead (no shards on disk -> every builder call falls back
      # live, exactly like every deploy before this step existed).
      #
      # BUMPED 2026-08-18: data-2026-07 -> data-2026-07-2. Alapin coverage
      # (Caro-Kann sub-line) needed a larger game budget to clear its
      # 1,000-game display threshold; games=1,400,000 was re-ingested for
      # 2026-07 under ingest-dump.yml's new versioned-tag collision handling
      # (data-2026-07-2, published alongside the original data-2026-07
      # rather than replacing it -- see that workflow's own ROOT-CAUSE NOTE).
      # data-2026-07 stayed published as the rollback until that bump was
      # verified live, then was deleted via a separate, human-approved
      # decision, per the standing rule that the site never has zero
      # working releases on purpose -- which freed the bare data-2026-07 tag
      # name for reuse below.
      #
      # BUMPED 2026-08-29: data-2026-07-2 -> data-2026-07. Routine re-ingest,
      # not chasing a specific coverage gap -- games=1,800,000 (up from
      # 1,400,000), published under the now-free bare data-2026-07 tag (see
      # note above). data-2026-07-2 stays published as the rollback until
      # this bump is verified live, then gets deleted via a separate,
      # human-approved decision, same standing rule as above.
      - name: Download aggregate data release
        id: aggregate_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGGREGATE_DATA_TAG: data-2026-07
        run: |
          if gh release view "$AGGREGATE_DATA_TAG" >/dev/null 2>&1; then
            gh release download "$AGGREGATE_DATA_TAG" \
              --pattern "aggregates-*.tar.gz" \
              --output aggregates.tar.gz \
              --clobber
            mkdir -p data/aggregates
            tar -xzf aggregates.tar.gz -C data/aggregates
            rm aggregates.tar.gz
            echo "Extracted aggregate data release $AGGREGATE_DATA_TAG into data/aggregates/"
            echo "shards_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release tagged $AGGREGATE_DATA_TAG found -- building from live Opening Explorer API only, same as every deploy before this step existed."
            echo "shards_present=false" >> "$GITHUB_OUTPUT"
          fi

      # LICHESS_API_TOKEN stays required -- see the comment on the step
      # above for exactly which calls still need it now that aggregate data
      # is wired in (masters-database lookups, plus rare known-gap retries).
      - name: Build site
        run: npm run build:static
        env:
          LICHESS_API_TOKEN: ${{ secrets.LICHESS_API_TOKEN }}

      - name: Check internal links
        run: node scripts/checkLinks.js dist

      - name: Validate HTML
        run: npx html-validate "dist/**/*.html"

      # --skip-aggregates now only applies in the fallback branch, not
      # unconditionally: when "Download aggregate data release" (above)
      # actually extracted real shards, the source-side checks (1a/2/4/6a --
      # shard record integrity, sample-size monotonicity, shard size limits,
      # etc.) now have real data to check, same as ingest-dump.yml's own
      # verify step, so they run for real. When that step fell back to "no
      # release found" (its RESILIENCE comment), data/aggregates/ still only
      # has manifest.json checked out from git with no matching shards on
      # disk -- scripts/verifyAggregates.js's header comment explains why
      # that specific combination (manifest present, shards absent) is a
      # HARD FAIL from checks 1a/2/4/6a, not a WARN, so --skip-aggregates
      # must stay in that branch, exactly as it did before this change.
      - name: Verify data-sanity gates
        run: |
          if [ "${{ steps.aggregate_data.outputs.shards_present }}" = "true" ]; then
            node scripts/verifyAggregates.js dist
          else
            node scripts/verifyAggregates.js dist --skip-aggregates
          fi

      # Band-meta shards (dist/data/rep/, scripts/buildBandShards.js) --
      # a separate, run-by-hand dataset from data/aggregates/ above, checked
      # the same way. A genuinely missing dist/data/rep/manifest.json is a
      # non-gating WARN (the crawler hasn't been run/committed yet), same
      # convention as scripts/verifyAggregates.js's own missing-manifest
      # handling -- see that script's own header comment.
      - name: Verify band-shard data-sanity gates
        run: node scripts/verifyBandShards.js dist/data/rep

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      # A second, ordinary (non-Pages) copy of the same dist/ output so the
      # quality job below can download and audit it -- the Pages artifact
      # uploaded above is consumed directly by actions/deploy-pages and
      # isn't meant to be downloaded by another job.
      - name: Upload dist for quality job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-for-quality
          path: dist
          retention-days: 1

  quality:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-for-quality
          path: dist

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Enforce Lighthouse budget
        run: node scripts/lighthouseBudget.js dist

  deploy:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # IndexNow (src/indexNow.js, scripts/indexNowPing.js): instant crawl
      # ping to Bing/Yandex/Naver/Seznam/Yep, placed after the deploy step
      # above so the pages being submitted are already live. Needs its own
      # checkout (for the script + src/indexNow.js) and a fresh download of
      # the same dist/ the build job already produced (this job doesn't
      # otherwise have it -- deploy-pages consumes the Pages artifact
      # directly, not as files on disk here).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download dist for IndexNow ping
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-for-quality
          path: dist

      - name: Ping IndexNow
        run: node scripts/indexNowPing.js dist
