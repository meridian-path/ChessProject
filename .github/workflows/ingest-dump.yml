name: Ingest Lichess Database Dump

# Manual only, for now. This pulls several GB from a third-party,
# donation-funded server (database.lichess.org) and publishes a public
# GitHub Release asset -- a deliberate, separately-approved action, not
# something that should ever fire unattended until the pipeline has proven
# itself reliable over a few real runs.
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Dump month to ingest, YYYY-MM (fetches lichess_db_standard_rated_<month>.pgn.zst from database.lichess.org)'
        required: true
        type: string
      games:
        description: 'Game budget for this run -- the connection is destroyed the moment this many games have been scanned. Use 500000 for the first run against any never-before-ingested month (a cheap smoke test of the real header format and throughput). A 2026-08-15 games=8000000 run OOM''d (aggregate memory use is NOT bounded by games scanned -- see scripts/ingestDump.js''s header comment); until a real fix for that lands, step up gradually from a verified-good run rather than jumping straight to a large number, and watch the run''s own progress/heap log lines.'
        required: true
        type: string
        default: '500000'
      smoke_test:
        description: 'Smoke test (default true): tags the release "-smoke" and does NOT commit manifest.json back to master, so the live site keeps its current data source. Set to false only for a full-scale run that should become the site''s live data source, and only after a prior smoke-test run for the same month has been verified good.'
        required: true
        type: boolean
        default: true

# OFF pending a longer track record. Do not uncomment without a fresh
# human-gated decision covering an UNATTENDED (not just manual) run -- the
# approval this workflow currently has (see repo history around this file's
# introduction) covers workflow_dispatch runs only.
# schedule:
#   - cron: '0 6 1 * *'  # monthly, 1st of the month, 06:00 UTC

permissions:
  contents: write  # commits manifest.json back to master, and creates a Release -- deploy-pages.yml keeps contents: read

# Never run two ingests at once -- both hit the same upstream file, and
# Non-Negotiable 3 (bandwidth courtesy) already requires exactly one
# sequential GET per run.
concurrency:
  group: ingest-dump
  cancel-in-progress: false

# A generous but bounded ceiling well under GitHub's own 6-hour hard kill --
# a hang should fail fast and cheap, not silently eat a runner for hours.
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Fails in 5 seconds, not 40 minutes into a download, if the runner
      # image ever stops shipping either tool (spec open risk 7).
      - name: Preflight -- confirm zstd and curl are on PATH
        run: |
          zstd --version
          curl --version

      - name: Install dependencies
        run: npm ci

      # Added after the 2026-08-15 OOM (see scripts/ingestDump.js's header
      # comment): Node's own default old-space ceiling is conservative
      # (observed ~4128MB on this runner regardless of actual free memory),
      # not a real reflection of what's available. Rather than hardcode a
      # number that silently goes stale if GitHub changes the standard
      # runner's spec, size the heap from what this run's own runner
      # actually reports at the time -- 80% of total, leaving headroom for
      # the OS plus the curl/zstd/git/tar subprocesses this workflow also
      # runs, which don't count against Node's own heap flag but do share
      # the same physical memory.
      # NOTE (2026-08-15, second attempt): the first version of this step set
      # NODE_OPTIONS via `$GITHUB_ENV`, which GitHub Actions silently refuses
      # for a short list of security-sensitive variable names (NODE_OPTIONS
      # among them -- ##[error]Can't store NODE_OPTIONS output parameter
      # using '$GITHUB_ENV' command., confirmed against a real run). That
      # meant the "raised ceiling" was never actually applied and the next
      # step OOM'd again on Node's untouched ~4128MB default. Fixed by
      # computing the value as a step OUTPUT (`$GITHUB_OUTPUT`, which has no
      # such restriction) and passing it directly on node's own command
      # line as a V8 flag in the next step, never through the environment.
      - name: Configure Node heap ceiling from this runner's actual memory
        id: heap
        run: |
          TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
          HEAP_MB=$(( TOTAL_MB * 80 / 100 ))
          echo "heap_mb=${HEAP_MB}" >> "$GITHUB_OUTPUT"
          echo "runner total memory: ${TOTAL_MB}MB -> Node old-space ceiling: ${HEAP_MB}MB" | tee -a "$GITHUB_STEP_SUMMARY"

      # ROOT-CAUSE NOTE (2026-08-16, root-caused after 4 consecutive failed
      # runs): two of those four failures (2026-08-15 08:50 UTC and 10:50
      # UTC) were genuine OOM crashes in this step -- but the workflow
      # reported this step as PASSED both times, and the run only failed
      # ~15-20 minutes later at "Package aggregate shards" with a confusing,
      # unrelated-looking `tar: data/aggregates: Cannot open: No such file
      # or directory`. Cause: this step piped node's output to `tee`
      # without `pipefail`, so bash's `-e` only sees `tee`'s exit code
      # (always 0), never node's -- confirmed empirically, not assumed: a
      # real run's own step log literally shows `shell: /usr/bin/bash -e
      # {0}` (no `-o pipefail`) for this step, alongside a printed `FATAL
      # ERROR: ... JavaScript heap out of memory` crash in the same step's
      # output that the step nonetheless reported as a checkmark. Any
      # future crash here (OOM or otherwise) would be silently swallowed
      # the same way, costing another 15-20 minutes of runner time before a
      # misleading failure shows up two steps later. `set -o pipefail`
      # makes the pipeline's exit status the worst of its parts, so a node
      # crash now fails this step immediately and visibly.
      - name: Ingest dump prefix
        run: |
          set -euo pipefail
          node --max-old-space-size="${{ steps.heap.outputs.heap_mb }}" scripts/ingestDump.js \
            --month "${{ inputs.month }}" \
            --games "${{ inputs.games }}" \
            --out data/aggregates \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Aggregate-side data-sanity gates only (--skip-dist): this workflow
      # never builds dist/ -- that happens separately in deploy-pages.yml,
      # against whatever manifest.json this run commits back to master.
      - name: Verify data-sanity gates
        run: node scripts/verifyAggregates.js --aggregates data/aggregates --skip-dist

      - name: Package aggregate shards
        id: package
        run: |
          MONTH="${{ inputs.month }}"
          TAG="data-${MONTH}"
          if [ "${{ inputs.smoke_test }}" = "true" ]; then
            TAG="${TAG}-smoke"
          fi
          ASSET="aggregates-${MONTH}.tar.gz"
          tar -czf "$ASSET" -C data/aggregates .
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      # gh is preinstalled on ubuntu-latest runners and authenticates with
      # the automatically-issued, workflow-scoped GITHUB_TOKEN below -- no
      # third-party release-creation Action needed, so there is nothing here
      # to SHA-pin.
      #
      # ROOT-CAUSE NOTE (2026-08-16): one of the four consecutive failures
      # root-caused this date (the run at 2026-08-15 06:51 UTC) had nothing
      # to do with memory -- ingest/verify/package all genuinely succeeded,
      # and this step failed outright with `a release with the same tag
      # name already exists: data-2026-07-smoke`, because an earlier
      # smoke-test run for the same month (the recommended first run for
      # any never-before-ingested month, per this workflow's own `games`
      # input description) had already created that exact tag, and this
      # step has no idempotency for a rerun. Re-running the recommended
      # smoke test for a month that already has one is an ordinary,
      # expected operator action (e.g. re-verifying after a code fix, which
      # is literally what happened here) -- it should not hard-fail. Smoke
      # releases are explicitly documented as disposable: this workflow's
      # `smoke_test` input says a smoke run "does NOT commit manifest.json
      # back to master, so the live site keeps its current data source",
      # meaning nothing else depends on a smoke tag's stability, so
      # replacing it on rerun is safe and matches operator intent.
      #
      # ROOT-CAUSE NOTE (2026-08-18, human ruling rejecting decision
      # msz0yp4b-762053 "delete the old release first"): a non-smoke tag
      # collision used to hard-fail here and tell the operator to delete
      # the existing release manually before re-running -- deliberately
      # safe against silently overwriting live data, but backwards: the
      # existing release is the site's live rollback, and deleting it
      # BEFORE a verified-good replacement exists means the site can have
      # zero working releases if anything goes wrong in between. Instead of
      # failing, a non-smoke collision now walks forward to the next free
      # versioned suffix for the same month (data-<month>, then
      # data-<month>-2, data-<month>-3, ...) and publishes there,
      # ALONGSIDE the existing release -- nothing is ever deleted by this
      # step. deploy-pages.yml's AGGREGATE_DATA_TAG stays hand-pinned to
      # the old tag until a human-merged PR bumps it to the new one (see
      # that workflow's own comment on why "latest" is never used), so the
      # live site is unaffected by a new tag simply existing. Once the new
      # tag is verified good and the live site is confirmed serving it,
      # deleting the now-genuinely-stale old release stays a human-executed
      # action, decided fresh each time -- no agent delete rights here.
      - name: Create release and upload aggregate asset
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_TAG="${{ steps.package.outputs.tag }}"
          TAG="$BASE_TAG"
          if [ "${{ inputs.smoke_test }}" = "true" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "smoke-test release $TAG already exists (from a prior smoke run of this month) -- deleting it first; smoke releases are disposable by design (see this step's header comment)." | tee -a "$GITHUB_STEP_SUMMARY"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "non-smoke release $BASE_TAG already exists -- this month was already ingested at full scale. Publishing this run alongside it under the next free versioned tag rather than deleting anything (see this step's ROOT-CAUSE NOTE)." | tee -a "$GITHUB_STEP_SUMMARY"
              SUFFIX=2
              while gh release view "${BASE_TAG}-${SUFFIX}" >/dev/null 2>&1; do
                SUFFIX=$(( SUFFIX + 1 ))
              done
              TAG="${BASE_TAG}-${SUFFIX}"
              echo "selected next free tag: $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" \
            "${{ steps.package.outputs.asset }}" \
            --title "Aggregate data ${{ inputs.month }}${{ inputs.smoke_test == true && ' (smoke test)' || '' }}" \
            --notes "Ingested from database.lichess.org, month ${{ inputs.month }}, game budget ${{ inputs.games }}. See the attached manifest.json for the exact gamesScanned/gamesUsed/observedGameDateRange figures for this run."

      - name: Commit manifest back to master
        if: ${{ inputs.smoke_test == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aggregates/manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "data: update aggregate manifest for ${{ inputs.month }}"

          # A bare `git push` here races any unrelated PR merging to master
          # during this job's run window (Ingest+Verify+Package+Release can
          # take 30-90+ minutes) and LOSES that race outright -- a rejected
          # push is not retried, so a fully verified manifest.json silently
          # never lands on master even though every earlier step passed
          # (confirmed against a real run: 2026-07's ingest published its
          # Release asset fine but this step's push was rejected --
          # "! [rejected] master -> master (fetch first)" -- and nobody
          # noticed until a manual audit). manifest.json is the ONLY file
          # this job ever touches and it is fully regenerated fresh each
          # run, so there is no real content to reconcile on conflict: if
          # origin/master moved, rebase onto it keeping THIS run's freshly
          # verified manifest.json (rebase's "theirs" = the commit being
          # replayed, i.e. our local commit -- rebase inverts merge's
          # ours/theirs, see `git rebase --help`), then retry the push.
          # Bounded retries with backoff so a genuinely stuck remote fails
          # the job loudly instead of hanging.
          #
          # ROOT-CAUSE NOTE (2026-08-18): a bare `git push` targets
          # whatever branch is currently checked out, not literally
          # master. Harmless on a normal production dispatch
          # (checkout IS master there), but this workflow is also
          # legitimately dispatched via `workflow_dispatch --ref
          # <feature-branch>` to test a workflow change before merging it
          # (a documented, sanctioned practice) -- and on that path a bare
          # `git push` silently commits manifest.json onto the feature
          # branch instead of master, permanently diverging it after even
          # one rebase (every further push to that branch then fails to
          # fast-forward, not because master moved, but because the
          # feature branch can never fast-forward back). Pin the push
          # target explicitly to this repo's actual default branch
          # (`origin/HEAD -> origin/master`, confirmed via `git remote show
          # origin`) so the commit always lands on master regardless of
          # which ref this run was dispatched against.
          for attempt in 1 2 3 4 5; do
            echo "commit-back attempt ${attempt}/5: fetching origin/master and rebasing"
            git fetch origin master
            if ! git rebase -X theirs origin/master; then
              echo "rebase hit an unexpected conflict outside manifest.json -- aborting and retrying"
              git rebase --abort || true
              sleep $(( attempt * 5 ))
              continue
            fi
            if git push origin HEAD:refs/heads/master; then
              echo "pushed manifest.json to master on attempt ${attempt}"
              exit 0
            fi
            echo "push still rejected (attempt ${attempt}/5) -- master moved again, retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::failed to push data/aggregates/manifest.json to master after 5 rebase+push attempts -- master kept moving faster than this job could land on it. The data itself is safe in this run's GitHub Release; land manifest.json manually and investigate why master is churning this fast."
          exit 1
